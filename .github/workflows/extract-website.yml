name: Extract website files
on:
  workflow_dispatch:
  push:
    paths:
      - 'Superior-Remodeling-Owner-Website-Improved-1.zip'
      - '.github/workflows/extract-website.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website into repository root
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          archive = 'Superior-Remodeling-Owner-Website-Improved-1.zip'
          with ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  p = Path(item.filename)
                  if not p.parts or p.parts[0] != 'superior-owner-website':
                      raise ValueError('Unexpected archive path')
                  target = Path(*p.parts[1:])
                  if not target.parts or '..' in target.parts or target.is_absolute():
                      raise ValueError('Unsafe archive path')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
          PY
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html styles.css script.js assets/
          if ! git diff --cached --quiet; then
            git commit -m "Extract Superior website files"
            git push
          fi
