name: Deploy Superior public website to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'script.js'
      - 'assets/**'
      - '.github/workflows/azure-static-web-apps.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require Azure deployment authorization
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$AZURE_TOKEN" ]; then
            echo "::error::Cannot publish: AZURE_STATIC_WEB_APPS_API_TOKEN is missing. Create an Azure Static Web App and set its deployment token as this repository secret."
            exit 1
          fi

      - name: Check out website
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          set -eu
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/superior-logo.png

      - name: Deploy static website to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          output_location: ''
          skip_app_build: true
